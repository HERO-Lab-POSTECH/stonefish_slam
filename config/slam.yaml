# stonefish_slam — every slam_node parameter, in one file.
#
# Loaded first by every launch file; later sources override it (last wins):
#   config/mapping/method_<update_method>.yaml  per-method 3D probability-update values (picked by launch)
#   config/real_bag_overrides.yaml               real sea-trial profile (override_config:=… launch argument)
#   launch arguments                             mode:=…, enable_2d_mapping:=…, update_method:=…
# Separate files that are NOT slam_node parameters:
#   config/icp.yaml, config/icp_real_bag.yaml    libpointmatcher ICP chain (icp_config_file:=… launch argument)
#   config/dead_reckoning.yaml                   dead_reckoning_node (its own node, not started by slam.launch.py)
#
# Angles are radians unless the key says _deg. Frames: world_ned (NED) / base_link (FRD).
#
# '/**' = any node in any namespace: slam_node, the standalone mapping/feature/FFT nodes
# and the namespaced /mapping_2d/slam_node, /mapping_3d/slam_node of the combined launch
# all read this file (a node only takes the keys it declares).
/**:
  ros__parameters:
    # ==================== Data source ====================
    vehicle_name: 'bluerov2'
    sonar_topic: ''            # '' = /{vehicle_name}/fls/image      (real bag: the bag's FLS topic)
    odom_topic: ''             # '' = /{vehicle_name}/odometry       (real bag: the nav solution topic)
    sonar_compressed: false    # true = subscribe sensor_msgs/CompressedImage instead of Image

    # ==================== Module switches ====================
    # slam.launch.py mode:=localization / mode:=mapping overrides these presets; see the launch docstring.
    enable_2d_mapping: true
    enable_3d_mapping: true
    publish_point_cloud: true  # aggregated /stonefish_slam/slam/cloud (measured blocking ~30 s at 45 keyframes on real bags)

    # ==================== Sonar hardware ====================
    # Must match the simulator's FLS (stonefish_description bluerov2.scn <sensor name="fls">).
    sonar:
      horizontal_fov: 130.0            # degrees
      vertical_fov: 20.0               # degrees (beam aperture)
      num_beams: 512                   # = image width  (bearings)
      num_bins: 500                    # = image height (range bins)
      range_min: 0.5                   # m
      range_max: 40.0                  # m
      sonar_position: [0.0, 0.0, 0.0]  # m, relative to base_link (FRD)
      # Depression angle below the horizontal plane (0 = level, 90 = straight down).
      # The .scn <origin rpy> roll is measured from nadir instead: tilt = 90° − roll.
      # test_sonar_tilt_matches_sim_scenario.py holds the two repos to the same value.
      sonar_tilt_deg: 30.0

    # ==================== Feature extraction (CFAR, internal to slam_node) ====================
    CFAR:
      Ntc: 20        # training cells (reduced for the simulator)
      Ngc: 10        # guard cells
      Pfa: 0.01      # false-alarm rate
      rank: 10       # matrix rank (Ntc/2 recommended)
      alg: 'SOCA'    # CFAR variant, see cfar.cpp; SOCA works best here
    filter:
      threshold: 80    # min intensity (0-255) to keep a point; higher = fewer points
      resolution: 0.5  # point-cloud downsampling leaf size (m)
      radius: 1.0      # outlier-rejection radius (m)
      min_points: 5    # outlier-rejection min neighbours
      skip: 5          # process every Nth frame
    visualization:
      coordinates: 'cartesian'
      radius: 2.0
      color: 'green'

    # ==================== Keyframes & noise models ====================
    keyframe_duration: 1.0        # s between keyframes (1-4 m spacing works best)
    keyframe_duration_max: 0.0    # s; > 0 forces a keyframe even if the thresholds below never trip (real bags)
    keyframe_translation: 1.0     # m
    keyframe_rotation: 0.174533   # rad (10°)
    slam_prior_noise: [0.1, 0.1, 0.01]  # [x_sigma_m, y_sigma_m, theta_sigma_rad] initial pose
    slam_odom_noise: [0.2, 0.2, 0.02]   # dead-reckoning factor
    slam_icp_noise: [0.1, 0.1, 0.01]    # ICP factor
    slam_loop_robust_c: 3.0             # Cauchy robust kernel c, loop-closure (NSSM) factors only
    point_downsample_resolution: 0.5    # voxel leaf size (m) for ICP / publishing

    # ==================== Localization: sequential scan matching (ICP) ====================
    # FFT (below) seeds ICP when it succeeds; ICP then refines rotation and translation.
    ssm:
      enable: true
      min_points: 50         # min points to attempt SSM
      max_translation: 3.0   # m, rejection gate
      max_rotation: 0.5236   # rad (30°), rejection gate
      target_frames: 3       # previous keyframes the current frame is matched against

    # ==================== Loop closure (NSSM) + pairwise consistency (PCM) ====================
    nssm:
      enable: true
      min_st_sep: 15         # exclusion zone (keyframes) around the newest keyframe
      min_points: 150
      max_translation: 5.0   # m
      max_rotation: 0.5236   # rad (30°)
      source_frames: 5       # frames aggregated when trying a loop closure
      cov_samples: 30        # 0 = skip covariance sampling (slow on real data)
      try_interval: 1        # try a loop closure every N keyframes
    pcm_queue_size: 5        # PCM sliding window
    min_pcm: 3               # min pairwise-consistent loop closures to accept

    # ==================== FFT localization (rotation/translation seed for ICP) ====================
    fft_localization:
      enable: true
      range_min: 0.5                 # m, minimum reliable range
      verbose: true
      trans_erosion_iterations: 2    # translation-mask erosion (0 = off)
      trans_gaussian_sigma: 2.0
      trans_gaussian_truncate: 3.0
      # Validation against odometry (dead reckoning)
      validate_with_odom: true
      max_position_error: 0.5        # m
      max_rotation_error: 0.0872665  # rad (5.000° — the value, not an old "~20°" comment, is the truth)
      use_dr_rotation: false         # false: FFT estimates rotation too; true: rotation from DR, FFT supplies translation only

    # ==================== Semantic labels (object detection → SLAM) ====================
    # off = 오늘과 동일한 동작: 구독도 발행자도 카운터도 생기지 않고
    # /slam/cloud 는 4필드(XYZI) 스키마를 그대로 유지한다. A/B 의 기준선이다.
    semantic:
      enable: false
      detection_topic: ''      # '' = /sonar_yolo/detections (vision_msgs/Detection2DArray)
      max_stamp_delta: 0.05    # s, 검출↔소나 프레임을 같은 프레임으로 볼 stamp 오차 상한
      pending_timeout: 3.0     # s, 이 시간까지 검출이 안 오면 det_missing 확정 (키프레임 1 s × 3)
      min_conf: 0.25           # 이 미만 신뢰도의 탐지는 버린다

    # ==================== 2D mapping (occupancy grid) ====================
    mapping_2d:
      map_2d_resolution: 0.2    # m/pixel. 0.2 keeps the grid message ~1 MB; 0.1 would be 4x (this key was
                                # previously advertised as 0.1 but the node hard-coded 0.2 — now it is read)
      map_size: [4000, 4000]    # [width, height] pixels
      map_update_interval: 1    # update every N keyframes
      intensity_threshold: 10   # min intensity (0-255) for a pixel to count

    # ==================== 3D mapping (OctoMap; method_*.yaml adds the per-method values) ====================
    mapping_3d:
      map_3d_voxel_size: 0.3          # m
      min_probability: 0.7            # occupied-voxel threshold
      use_cpp_backend: true           # C++ backend (DDA + OpenMP)
      use_cpp_ray_processor: true
      use_dda_traversal: true
      bearing_step: 4                 # process every Nth bearing (4 → 128 of 512)
      use_range_weighting: true       # exponential range weighting
      lambda_decay: 0.1
      enable_propagation: true        # interpolate between neighbouring bearings
      propagation_radius: 2           # ± bearings
      propagation_sigma: 1.5          # Gaussian weight sigma
      enable_gaussian_weighting: true
      update_method: 'iwlo'           # 'log_odds' | 'weighted_avg' | 'iwlo' → config/mapping/method_<name>.yaml
