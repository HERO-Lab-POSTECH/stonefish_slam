# SLAM Integration Configuration
# Contains: Module enable flags
# NOTE: For module-specific parameters, see:
#   - sonar.yaml: Sonar hardware parameters (shared with feature extraction)
#   - feature.yaml: CFAR and filtering parameters
#   - localization.yaml: SLAM keyframes, noise models, SSM, ICP config path
#   - factor_graph.yaml: Loop closure (NSSM) and consistency verification (PCM)
#   - mapping.yaml: 2D/3D mapping parameters
slam_node:
  ros__parameters:
    # ==================== Module Enable Flags ====================
    enable_2d_mapping: true
    enable_3d_mapping: true

    # Localization modules
    ssm.enable: true    # Sequential Scan Matching (for localization)
    nssm.enable: true   # Non-Sequential Scan Matching (loop closure)

    # FFT localization (optional)
    fft_localization:
      enable: true     # Enable FFT-based rotation/translation estimation
      range_min: 0.5   # Minimum reliable range (meters)
      verbose: true    # Enable debug output for FFT localization
      trans_erosion_iterations: 2  # Erosion iterations for translation mask (0=disabled)
      trans_gaussian_sigma: 2.0    # Gaussian sigma for edge smoothing (default: 4.0)
      trans_gaussian_truncate: 3.0 # Gaussian kernel truncation factor (default: 4.0)
      # Validation parameters (compare FFT with odometry)
      validate_with_odom: true   # Enable DR vs FFT comparison
      max_position_error: 0.5    # Max allowed position difference (meters)
      # 주석이 아니라 값이 진실이다: 0.0872665 rad = 5.000°. 종전 주석의 "~20°"
      # 는 노드 declare_parameter 기본값(0.35 rad)의 주석을 그대로 옮겨 온 것으로
      # 보인다 — 값을 20°로 올릴지 5°를 유지할지는 기각률을 바꾸는 동작 변경이라
      # owner 결정 사항이고, 여기서는 주석만 실제값에 맞춘다.
      max_rotation_error: 0.0872665   # Max allowed rotation difference (radians, 5.000°)
      use_dr_rotation: true  # true: DR 회전 사용 (테스트), false: FFT 회전 사용
