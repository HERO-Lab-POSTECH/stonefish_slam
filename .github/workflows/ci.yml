name: ci
on: [push, pull_request]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # package.xml 의 exec_depend 와 갈라지지 않게 유지할 것 — 러너는 rosdep 을
      # 쓰지 않으므로 이 줄이 유일한 설치 경로다. pyyaml = python3-yaml.
      - run: pip install pytest 'numpy<2' scipy scikit-learn gtsam opencv-python-headless pyyaml
      - run: python -m pytest -v
